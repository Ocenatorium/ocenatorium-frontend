<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ocenatorium</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>Ocenatorium - obserwacje</h1>
      <p class="meta">Ostatnia aktualizacja: <span id="lastUpdate">—</span></p>
      <button id="infoBtn">🔄 Pokaż Informacje</button>
      <p id="infoText" style="display: none">
        Ocenatorium to aplikacja do analizy danych o głosowaniach w Sejmie.
        Używa plików JSON i wizualizacji, by pokazać aktywność posłów.
      </p>
    </header>
    <section class="chart">
      <h2>Profesje</h2>
      <canvas
        id="professionChart"
        style="max-width: 1100px; margin: 16px 0"
      ></canvas>
    </section>
    <main id="root"></main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./app.js" defer></script>
  </body>
</html>
